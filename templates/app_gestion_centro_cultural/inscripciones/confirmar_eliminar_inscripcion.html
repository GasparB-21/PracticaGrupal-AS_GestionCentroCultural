{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar anulación</title>
    <link rel="stylesheet" href="{% static 'bootstrap/dist/css/bootstrap.min.css' %}">

    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
            min-height: 100vh;
            padding: 40px 16px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        h1 { font-weight: 800; letter-spacing: -1px; color: #212529; margin-bottom: 1.5rem; }

        .table-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            box-shadow: 0 12px 28px rgba(33, 37, 41, 0.07);
            margin: 0 auto;
            max-width: 650px;
        }

        .btn-confirmar {
            display: inline-block;
            background-color: #dc3545;
            color: white !important;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-confirmar:hover { background-color: #bb2d3b; }

        .btn-cancelar {
            display: inline-block;
            background-color: #6c757d;
            color: white !important;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            margin-left: 10px;
            transition: background 0.2s;
        }

        .btn-cancelar:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <main class="confirmation-page">
    <h1>Confirmar anulación</h1>

    <div class="table-container shadow-sm">
        <p class="fs-5 mb-4">
            ¿Estás seguro de que quieres anular la inscripción de
            <strong>"{{ inscripcion.usuario.nombre }}"</strong>
            en la actividad
            <strong>"{{ inscripcion.actividad.nombre }}"</strong>?
        </p>

        <form method="POST" action="{% url 'confirmar_eliminar_inscripcion' inscripcion.actividad.id inscripcion.usuario.id %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" name="confirmar" value="si" class="btn-confirmar">
                Sí, anular
            </button>
        </form>

        <a href="{{ referer }}" class="btn-cancelar">
            Cancelar y volver a la página anterior
        </a>
    </div>
    </main>
</body>
</html>
